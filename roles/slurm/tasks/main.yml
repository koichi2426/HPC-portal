---
- name: apt ロック解放待ち
  ansible.builtin.import_tasks: ../../common/tasks/wait_for_apt.yml

- name: 標準Ubuntu sourcesのuniverse有効化状態を確認 (ARM用)
  ansible.builtin.command: grep -Eq '^Components:.*\buniverse\b' /etc/apt/sources.list.d/ubuntu.sources
  register: slurm_ubuntu_sources_universe
  failed_when: false
  changed_when: false
  when: ansible_architecture == 'aarch64'

- name: universeリポジトリを有効化 (ARM用・標準sources未設定時)
  ansible.builtin.apt_repository:
    repo: "deb http://ports.ubuntu.com/ubuntu-ports {{ ansible_distribution_release }} universe"
    state: present
  when:
    - ansible_architecture == 'aarch64'
    - slurm_ubuntu_sources_universe.rc != 0

- name: 重複したuniverseリポジトリ定義を削除 (ARM用)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/ports_ubuntu_com_ubuntu_ports.list
    state: absent
  when:
    - ansible_architecture == 'aarch64'
    - slurm_ubuntu_sources_universe.rc == 0

- name: aptキャッシュを強制更新
  ansible.builtin.apt:
    update_cache: yes
  register: slurm_apt_cache
  until: slurm_apt_cache is succeeded
  retries: 5
  delay: 15

- name: Slurm関連パッケージをインストール
  ansible.builtin.package:
    name:
      - slurmctld
      - slurmd
      - slurm-client
      - munge
    state: present

- name: Slurmの状態ディレクトリを作成
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/slurm, owner: root, group: root, mode: "0755" }
    - { path: /var/spool/slurmctld, owner: slurm, group: slurm, mode: "0755" }
    - { path: /var/spool/slurmd, owner: root, group: root, mode: "0755" }
    - { path: /var/log/slurm, owner: slurm, group: slurm, mode: "0755" }

- name: NVIDIA GPU数を検出
  ansible.builtin.command: nvidia-smi -L
  register: slurm_nvidia_smi
  failed_when: false
  changed_when: false
  check_mode: false

- name: Slurmで管理するGPU数を設定
  ansible.builtin.set_fact:
    slurm_effective_gpu_count: "{{ slurm_gpu_count | default(slurm_nvidia_smi.stdout_lines | select('match', '^GPU ') | list | length) | int }}"

- name: mungeキーを作成
  ansible.builtin.shell: |
    dd if=/dev/urandom of=/etc/munge/munge.key bs=1 count=1024
    chown munge:munge /etc/munge/munge.key
    chmod 0400 /etc/munge/munge.key
  args:
    creates: /etc/munge/munge.key
  notify: mungeを再起動

- name: GPU GRES設定を配置
  ansible.builtin.template:
    src: gres.conf.j2
    dest: /etc/slurm/gres.conf
    owner: root
    group: root
    mode: "0644"
  when: slurm_effective_gpu_count | int > 0
  notify: slurmサービスを再起動

- name: GPU未検出時はGRES設定を削除
  ansible.builtin.file:
    path: /etc/slurm/gres.conf
    state: absent
  when: slurm_effective_gpu_count | int == 0
  notify: slurmサービスを再起動

- name: 単一ノード用slurm.confを配置
  ansible.builtin.template:
    src: slurm.conf.j2
    dest: /etc/slurm/slurm.conf
    owner: root
    group: root
    mode: "0644"
  notify: slurmサービスを再起動

- name: mungeを有効化して起動
  ansible.builtin.systemd:
    name: munge
    enabled: true
    state: started

- name: slurmctldを有効化して起動
  ansible.builtin.systemd:
    name: slurmctld
    enabled: true
    state: started

- name: slurmdを有効化して起動
  ansible.builtin.systemd:
    name: slurmd
    enabled: true
    state: started
