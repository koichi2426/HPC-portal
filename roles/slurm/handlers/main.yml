---
- name: Slurm関連サービスを再起動
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop:
    - munge
    - slurmctld
    - slurmd
  when: >-
    not (hpc_force_service_restarts | default(false) | bool)
    and slurm_active_jobs_during_deploy.rc == 0
    and (slurm_active_jobs_during_deploy.stdout | trim | length == 0)
  listen: Slurm再起動を要求
