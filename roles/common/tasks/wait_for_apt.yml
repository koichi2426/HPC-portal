---
- name: apt ロック解放待ち
  ansible.builtin.shell: |
    set -euo pipefail
    for _i in $(seq 1 36); do
      if ! fuser /var/lib/apt/lists/lock >/dev/null 2>&1 \
        && ! fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 \
        && ! fuser /var/lib/dpkg/lock >/dev/null 2>&1; then
        exit 0
      fi
      sleep 5
    done
    echo "apt lock still held after 180s:" >&2
    fuser -v /var/lib/apt/lists/lock /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock 2>/dev/null || true
    exit 1
  args:
    executable: /bin/bash
  changed_when: false
