---
- name: ホストの MATLAB インストールを検出
  ansible.builtin.shell: |
    set -euo pipefail
{% for p in hpc_matlab_search_paths %}
    if [ -x "{{ p }}/bin/matlab" ]; then
      printf '%s\n' "{{ p }}"
      exit 0
    fi
{% endfor %}
    exit 1
  args:
    executable: /bin/bash
  register: hpc_matlab_detect
  changed_when: false
  failed_when: false
  when: hpc_matlab_enabled | default(true) | bool

- name: MATLAB の検出結果を記録
  ansible.builtin.set_fact:
    hpc_matlab_root: "{{ hpc_matlab_detect.stdout | default('', true) | trim }}"
  when: hpc_matlab_enabled | default(true) | bool

- name: MATLAB が見つからない場合は警告
  ansible.builtin.debug:
    msg: >-
      ホスト上で MATLAB が見つかりません（{{ hpc_matlab_search_paths | join(', ') }}）。
      MATLAB アプリを使うには /usr/local/MATLAB/R20xxb 等へのインストールとライセンス設定が必要です。
      公式 MPM/Docker イメージは glnxa64 (x86_64) 向けのため、GB10 (aarch64) ではホストへの直接インストールが必要な場合があります。
  when:
    - hpc_matlab_enabled | default(true) | bool
    - hpc_matlab_root | default('') | length == 0

- name: 検出した MATLAB のバージョンを表示
  ansible.builtin.command: "{{ hpc_matlab_root }}/bin/matlab -batch version"
  register: hpc_matlab_version
  changed_when: false
  failed_when: false
  when:
    - hpc_matlab_enabled | default(true) | bool
    - hpc_matlab_root | default('') | length > 0

- name: MATLAB バージョン確認結果
  ansible.builtin.debug:
    var: hpc_matlab_version.stdout_lines
  when:
    - hpc_matlab_enabled | default(true) | bool
    - hpc_matlab_root | default('') | length > 0
    - hpc_matlab_version.stdout_lines is defined
