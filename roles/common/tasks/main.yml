---
- name: apt ロック解放待ち
  ansible.builtin.import_tasks: wait_for_apt.yml

- name: 基本パッケージをインストール
  ansible.builtin.package:
    name:
      - curl
      - git
      - python3
      - python3-pip
    state: present

- name: GRUBにcgroupオプションを設定
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="quiet cgroup_enable=memory swapaccount=1"'
    backup: true
  notify: grubを更新

- name: CUDA Toolkit / nvcc を整備
  ansible.builtin.import_tasks: cuda.yml
  tags: [cuda]

- name: MATLAB インストールを検出
  ansible.builtin.import_tasks: matlab.yml
  tags: [matlab]
