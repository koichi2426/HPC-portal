---
- name: HPC 環境クリーンアップ
  hosts: gx10
  become: true
  tasks:
    - name: shared Ollama Slurm job を停止
      ansible.builtin.shell: |
        if command -v /usr/local/sbin/hpc-ollama >/dev/null 2>&1; then
          /usr/local/sbin/hpc-ollama stop || true
        else
          squeue -h -u "{{ ollama_service_user | default('hpc-ollama') }}" -n "{{ ollama_slurm_job_name | default('shared-ollama') }}" -o '%A' \
            | xargs -r scancel
        fi
      args:
        executable: /bin/bash
      failed_when: false
      changed_when: false

    - name: 関連サービスの停止
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      failed_when: false
      loop:
        - jupyterhub
        - litellm
        - searxng
        - hpc-search-mcp
        - slurmctld
        - slurmd
        - munge
        - cloudflared

    - name: 実行ユーザーのゾンビプロセス親を強制終了
      ansible.builtin.shell: |
        set -o pipefail
        TARGET_USER="{{ ansible_user }}"
        ps -u "$TARGET_USER" -o state=,ppid= \
          | awk '$1 ~ /^Z/ && $2 > 1 {print $2}' \
          | sort -u \
          | while read -r ppid; do
              parent_user="$(ps -o user= -p "$ppid" | awk '{print $1}')"
              if [ "$parent_user" = "$TARGET_USER" ]; then
                printf '%s\n' "$ppid"
              fi
            done \
          | xargs -r kill -9
      args:
        executable: /bin/bash
      failed_when: false

    - name: 実行ユーザーのAI/コンテナ残存プロセスを強制終了
      ansible.builtin.shell: |
        pgrep -u "{{ ansible_user }}" -f '(ollama|apptainer|open-webui|open_webui)' \
          | xargs -r kill -9
      failed_when: false

    - name: shared Ollama ユーザーの残存プロセスを強制終了
      ansible.builtin.shell: |
        pgrep -u "{{ ollama_service_user | default('hpc-ollama') }}" -f '(ollama|apptainer|curl)' \
          | xargs -r kill -9
      failed_when: false

    - name: パッケージの削除 (Purge)
      ansible.builtin.apt:
        name:
          - slurmctld
          - slurmd
          - slurm-client
          - munge
        state: absent
        purge: true

    - name: 設定ディレクトリとログの物理削除
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/slurm
        - /etc/munge
        - /var/spool/slurmctld
        - /var/spool/slurmd
        - /var/log/slurm
        - /etc/jupyterhub
        - /var/lib/jupyterhub
        - /etc/litellm
        - /opt/litellm
        - /opt/hpc-portal/ollama
        - /etc/searxng
        - /var/lib/searxng
        - /etc/hpc-search-mcp
        - /opt/hpc-search-mcp
        - /var/lib/hpc-search-mcp
        - /var/log/hpc-ollama
        - /usr/local/sbin/hpc-ollama
        - /opt/images/ollama.sif
        - /opt/images/searxng.sif
        - /opt/apptainer/ollama.def
        - /opt/apptainer/searxng.def
        - /usr/local/bin/ollama
        - /usr/local/lib/ollama
        - /tmp/ollama-linux.tar.zst
        - /etc/systemd/system/jupyterhub.service
        - /etc/systemd/system/litellm.service
        - /etc/systemd/system/searxng.service
        - /etc/systemd/system/hpc-search-mcp.service
        - /etc/systemd/system/cloudflared.service

    - name: Cloudflare Tunnel関連の削除
      ansible.builtin.file:
        path: /etc/cloudflared
        state: absent

    - name: systemdをリロード
      ansible.builtin.systemd:
        daemon_reload: true
      failed_when: false

    - name: mungeユーザーの削除
      ansible.builtin.user:
        name: munge
        state: absent
        remove: true
      failed_when: false

    - name: SearXNGユーザーを削除
      ansible.builtin.user:
        name: "{{ searxng_service_user | default('searxng') }}"
        state: absent
        remove: true
      failed_when: false

    - name: Web検索MCPユーザーを削除
      ansible.builtin.user:
        name: "{{ search_mcp_user | default('hpc-search-mcp') }}"
        state: absent
        remove: true
      failed_when: false

    - name: 終了メッセージ
      ansible.builtin.debug:
        msg: "クリーンアップが完了しました。モデル・DBなどのデータは残しています。完全削除は make cleanup-purge-data を使ってください。"
