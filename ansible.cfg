[defaults]
inventory = inventory/production.ini
host_key_checking = False
retry_files_enabled = False
timeout = 60
interpreter_python = auto_silent
# ホームがモデルで満杯のとき ~/.ansible/tmp が作れず失敗するため /tmp を使う
remote_tmp = /tmp/.ansible-${USER}/tmp
local_tmp = /tmp/.ansible-local/tmp

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=30 -o ServerAliveCountMax=5
pipelining = True
