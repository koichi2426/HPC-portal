---
- name: HPC 環境クリーンアップ
  hosts: gx10
  become: true
  tasks:
    - name: 関連サービスの停止
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      failed_when: false
      loop:
        - jupyterhub
        - slurmctld
        - slurmd
        - munge
        - cloudflared

    - name: 実行ユーザーのゾンビプロセス親を強制終了
      ansible.builtin.shell: |
        set -o pipefail
        TARGET_USER="{{ ansible_user }}"
        ps -u "$TARGET_USER" -o state=,ppid= \
          | awk '$1 ~ /^Z/ && $2 > 1 {print $2}' \
          | sort -u \
          | while read -r ppid; do
              parent_user="$(ps -o user= -p "$ppid" | awk '{print $1}')"
              if [ "$parent_user" = "$TARGET_USER" ]; then
                printf '%s\n' "$ppid"
              fi
            done \
          | xargs -r kill -9
      args:
        executable: /bin/bash
      failed_when: false

    - name: 実行ユーザーのAI/コンテナ残存プロセスを強制終了
      ansible.builtin.shell: |
        pgrep -u "{{ ansible_user }}" -f '(ollama|apptainer|open-webui|open_webui)' \
          | xargs -r kill -9
      failed_when: false

    - name: パッケージの削除 (Purge)
      ansible.builtin.apt:
        name:
          - slurmctld
          - slurmd
          - slurm-client
          - munge
        state: absent
        purge: true

    - name: 設定ディレクトリとログの物理削除
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/slurm
        - /etc/munge
        - /var/spool/slurmctld
        - /var/spool/slurmd
        - /var/log/slurm
        - /etc/jupyterhub
        - /var/lib/jupyterhub

    - name: Cloudflare Tunnel関連の削除
      ansible.builtin.file:
        path: /etc/cloudflared
        state: absent

    - name: mungeユーザーの削除
      ansible.builtin.user:
        name: munge
        state: absent
        remove: true
      failed_when: false

    - name: 終了メッセージ
      ansible.builtin.debug:
        msg: "クリーンアップが完了しました。サーバーは更地に戻りました。"