[project]
name = "hpc-portal"
version = "0.1.0"
description = "HPC portal deployment and management tools"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "batchspawner",
    "jupyterhub>=5.5,<6",
    "nest-asyncio",
    "psutil",
    "pydantic>=2,<3",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
pythonpath = ["roles/jupyterhub/files"]
