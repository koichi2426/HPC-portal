[project]
name = "hpc-portal"
version = "0.1.0"
description = "HPC portal deployment and management tools"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "aiohttp>=3.12,<4",
    "cryptography>=44",
    "PyJWT[crypto]>=2.10,<3",
    "batchspawner",
    "dnspython==2.8.0",
    "jupyterhub>=5.5,<6",
    "nest-asyncio",
    "psutil",
    "pydantic>=2,<3",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"ansible/roles/jupyterhub/files/jupyterhub_config.py" = ["E402"]
